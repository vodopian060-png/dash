const GH={owner:'vodopian060-png',repo:'dash',branch:'main'};const SALT='nerud-dash-v1';
let KEY=null;const enc=new TextEncoder(),dec=new TextDecoder();
async function deriveKey(pw){const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode(SALT),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function b64(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const bin=atob(s.replace(/\s/g,''));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
async function encryptJson(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(obj)));const out=new Uint8Array(12+ct.byteLength);out.set(iv);out.set(new Uint8Array(ct),12);return b64(out)}
async function decryptJson(text){const b=unb64(text.trim());const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12));return JSON.parse(dec.decode(pt))}
async function fetchEnc(name){const r=await fetch(`data/${name}.enc?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(name+' '+r.status);return decryptJson(await r.text())}
const tokenKey='nl-gh-token';const getToken=()=>{try{return localStorage.getItem(tokenKey)||''}catch(e){return ''}};
async function ghPut(path,content,message){const url=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;const h={Authorization:'Bearer '+getToken(),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};let sha;const g=await fetch(url+'?ref='+GH.branch,{headers:h});if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('GitHub '+g.status);
  const body={message,content:b64(enc.encode(content)),branch:GH.branch};if(sha)body.sha=sha;const r=await fetch(url,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const t=await r.text();throw new Error('GitHub '+r.status+': '+t.slice(0,120))}return r.json()}
async function afterLoad(){const lo=document.getElementById('logout');if(lo)lo.onclick=()=>{try{localStorage.removeItem('nl-pw');localStorage.removeItem(tokenKey)}catch(e){}location.reload()};const tk=document.getElementById('gh-token');const gs=document.getElementById('gh-status');const showTok=()=>{const t=getToken();if(gs)gs.textContent=t?`Токен сохранён на этом устройстве (…${t.slice(-6)}). Проверяю доступ…`:'Токен не задан — загрузка не будет работать.'};
  if(tk){tk.value=getToken();showTok();const save=()=>{try{localStorage.setItem(tokenKey,tk.value.trim())}catch(e){}showTok();checkTok()};tk.onchange=save;const sb=document.getElementById('gh-save');if(sb)sb.onclick=save;
    const checkTok=async()=>{const t=getToken();if(!t||!gs)return;try{const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});const j=await r.json();if(r.ok&&j.permissions&&j.permissions.push)gs.textContent=`Токен сохранён (…${t.slice(-6)}), доступ на запись в ${GH.owner}/${GH.repo} подтверждён ✓`;else if(r.ok)gs.textContent=`Токен принят, но без права записи — проверь Contents: Read and write`;else gs.textContent=`GitHub не принял токен (${r.status}) — проверь, что скопирован целиком`}catch(e){gs.textContent='Не удалось проверить токен: '+e.message}};if(getToken())checkTok()}
  const go=document.getElementById('go');if(!go)return;go.onclick=async()=>{const inp=document.getElementById('files');const log=document.getElementById('load-log');if(!getToken()){log.innerHTML='<div class="status bad">Сначала вставь токен GitHub (см. ниже).</div>';return}if(!inp.files.length){log.innerHTML='<div class="status bad">Выбери файлы.</div>';return}go.disabled=true;log.innerHTML='';
  const meta=st.meta||{};const by=(document.getElementById('gh-name')||{}).value||'';
  for(const f of inp.files){const el=document.createElement('div');el.className='status';el.textContent=`${f.name}: читаю…`;log.appendChild(el);
    try{const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{cellDates:true});const kind=NLParse.detect(wb);let payload,note,key,file;
      if(kind==='grafik'){const g=NLParse.parseGrafik(wb,XLSX);if(!g.rows.length)throw new Error('не нашёл месячных листов');payload=NLParse.pack(g);const ds=g.rows.map(x=>x.d).filter(Boolean).sort();note=`${N(g.rows.length)} рейсов, ${ds[0]} – ${ds[ds.length-1]}`;key='grafik';file='grafik';st.g=g.rows}
      else if(kind==='sverki'){const sv=NLParse.parseSverki(wb,XLSX);if(!sv.cust.length&&!sv.carr.length)throw new Error('не нашёл листов «СЧЕТА НЛ 2026» / «2026»');payload=sv;note=`${N(sv.cust.length)} строк по заказчикам, ${N(sv.carr.length)} по перевозчикам`;key='sverki';file='sverki';st.s=sv}
      else{const b=NLParse.parseBank(wb,XLSX);if(!b.ops.length)throw new Error('не похоже на выписку Сбера или Альфы');payload=b;const ds=b.ops.map(x=>x.d).sort();note=`${b.bank} ${b.acct.slice(-4)}: ${N(b.ops.length)} операций, ${ds[0]} – ${ds[ds.length-1]}`;key='bank';file='bank-'+b.acct.slice(-4)}
      el.textContent=`${f.name}: ${note} — шифрую и отправляю в GitHub…`;
      const ct=await encryptJson(payload);await ghPut(`data/${file}.enc`,ct,`data: ${file} (${note})`);
      const rec={file,at:new Date().toISOString(),by,note,name:f.name};
      if(key==='bank'){const list=(meta.bank||[]).filter(x=>x.acct!==payload.acct);list.push({...rec,bank:payload.bank,acct:payload.acct});meta.bank=list}else meta[key]=rec;
      el.textContent=`${f.name}: ${note} — сохранено`;el.classList.add('ok')}
    catch(e){el.textContent=`${f.name}: ошибка — ${e.message||e}`;el.classList.add('bad')}}
  try{await ghPut('data/meta.enc',await encryptJson(meta),'data: meta');st.meta=meta;const d=document.createElement('div');d.className='status ok';d.textContent='Готово. Остальные устройства увидят новые данные через 1–2 минуты (GitHub Pages пересобирает сайт).';log.appendChild(d)}catch(e){const d=document.createElement('div');d.className='status bad';d.textContent='Не удалось записать список файлов: '+e.message;log.appendChild(d)}
  go.disabled=false;if(st.b||meta.bank)await loadBank(meta);refreshPeriod();}}
async function loadBank(meta){try{if(meta.bank&&meta.bank.length){const parts=await Promise.all(meta.bank.map(b=>fetchEnc(b.file)));st.b={ops:parts.flatMap(p=>p.ops),start:meta.bankStart||101038.29}}else st.b=null}catch(e){console.error(e);st.b=null}}
function refreshPeriod(){const ms=[...new Set(st.g.map(x=>x.m))].sort();const ps=$('#f-period');ps.innerHTML='<option value="all">Весь год</option>'+ms.map(m=>`<option value="${m}">${MN[m]}</option>`).join('');ps.value=st.period;const last=st.g.map(x=>x.d).filter(Boolean).sort().pop();const lb=st.b&&st.b.ops.length?st.b.ops.map(o=>o.d).sort().pop():'';const fd=x=>x?x.split('-').reverse().slice(0,2).join('.'):'—';$('#meta').textContent=st.g.length?`рейсы по ${fd(last)}${lb?' · банк по '+fd(lb):''}`:'нет данных'}
async function loadAll(){let meta={};try{meta=await fetchEnc('meta')}catch(e){console.error(e);throw e}st.meta=meta;
  try{if(meta.grafik){st.g=NLParse.unpack(await fetchEnc(meta.grafik.file||'grafik')).rows}else st.g=[]}catch(e){console.error(e);st.g=[]}
  try{st.s=meta.sverki?await fetchEnc(meta.sverki.file||'sverki'):null}catch(e){st.s=null}
  await loadBank(meta);refreshPeriod()}
// ---------- render ----------
function render(){document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.view));document.querySelectorAll('.datebar .chip').forEach(c=>c.classList.toggle('on',c.dataset.q==='x'?false:false));const v=st.view;
  try{main.innerHTML={today:vToday,check:vCheck,over:vOver,trips:vTrips,carr:()=>entityView('carr'),cust:()=>entityView('cust'),fleet:vFleet,debt:vDebt,cash:vCash,docs:vDocs,load:vLoad}[v]();
  ({today:afterToday,check:afterCheck,over:afterOver,trips:afterTrips,carr:()=>afterEntity('carr'),cust:()=>afterEntity('cust'),fleet:afterFleet,debt:afterDebt,cash:afterCash,docs:afterDocs,load:afterLoad}[v])()}catch(e){console.error(e);main.innerHTML=`<div class="status bad">Ошибка отрисовки: ${esc(e.message)}</div>`}
  main.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{const id=b.dataset.more;st.more[id]=(st.more[id]||1)+1;const y=window.scrollY;render();window.scrollTo(0,y)})}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.view=b.dataset.v;st.sel=null;st.tf.page=1;st.tf.q='';st.more={};render();window.scrollTo(0,0)});
$('#f-period').addEventListener('change',e=>{st.period=e.target.value;st.tf.page=1;render()});
$('#f-from').addEventListener('change',e=>{st.from=e.target.value;st.tf.page=1;render()});$('#f-to').addEventListener('change',e=>{st.to=e.target.value;st.tf.page=1;render()});
document.querySelector('.datebar .chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const q=c.dataset.q;const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);const last=st.g.map(x=>x.d).filter(Boolean).sort().pop();const base=last?new Date(last+'T00:00:00'):new Date();
  if(q==='x'){st.from='';st.to=''}else if(q==='0'){st.from=st.to=iso(base)}else if(q==='1'){const d=new Date(base);d.setDate(d.getDate()-1);st.from=st.to=iso(d)}else{const d=new Date(base);d.setDate(d.getDate()-(+q-1));st.from=iso(d);st.to=iso(base)}
  $('#f-from').value=st.from;$('#f-to').value=st.to;if(st.from)st.period='all';$('#f-period').value=st.period;st.tf.page=1;render()});
async function enter(pw,keep){KEY=await deriveKey(pw);try{await loadAll()}catch(e){KEY=null;$('#pw-err').classList.remove('hidden');return false}if(keep){try{localStorage.setItem('nl-pw',pw)}catch(e){}}$('#gate').classList.add('hidden');render();return true}
$('#pw-go').onclick=()=>enter($('#pw').value,$('#pw-keep').checked);$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')enter($('#pw').value,$('#pw-keep').checked)});
(async()=>{let saved='';try{saved=localStorage.getItem('nl-pw')||''}catch(e){}if(saved){const ok=await enter(saved,false);if(ok)return;try{localStorage.removeItem('nl-pw')}catch(e){}}main.innerHTML='<div class="empty">Введите пароль.</div>'})();
})();
</script>
</body></html>
